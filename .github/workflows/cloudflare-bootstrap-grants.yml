name: Cloudflare verify user provisioning

on:
  workflow_dispatch:
    inputs:
      principal_id:
        description: Verified Cloudflare Access principal to inspect (must begin cf-user:)
        required: true
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify:
    name: Verify private Personal provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Validate principal input
        shell: bash
        env:
          PRINCIPAL_ID: ${{ inputs.principal_id }}
        run: |
          set -euo pipefail
          [[ "$PRINCIPAL_ID" =~ ^cf-user:[A-Za-z0-9:_-]{3,120}$ ]] || {
            echo 'principal_id must be a verified cf-user:* identity' >&2
            exit 1
          }

      - name: Require Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN secret' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Verify private Personal provisioning
        shell: bash
        env:
          PRINCIPAL_ID: ${{ inputs.principal_id }}
        run: |
          set -euo pipefail
          SQL="SELECT u.user_id, m.workspace_key, m.workspace_id, m.role, w.workspace_type FROM user_principals p JOIN users u ON u.user_id = p.user_id JOIN workspace_memberships m ON m.user_id = u.user_id JOIN workspaces w ON w.workspace_id = m.workspace_id WHERE p.principal_id = '$PRINCIPAL_ID' AND u.status = 'ACTIVE' AND m.workspace_key = 'personal' AND m.role IN ('OWNER','MEMBER');"
          npx wrangler d1 execute daily-command-center-prod --remote --config wrangler.jsonc --json --command "$SQL" > /tmp/dcc-provisioning.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/dcc-provisioning.json', 'utf8'));
          const batches = Array.isArray(payload) ? payload : [payload];
          const rows = batches.flatMap((batch) => Array.isArray(batch?.results) ? batch.results : []);
          if (rows.length !== 1) {
            throw new Error(`Expected exactly one active Personal membership; found ${rows.length}.`);
          }
          const row = rows[0];
          if (
            row.workspace_key !== 'personal' ||
            row.workspace_type !== 'PERSONAL' ||
            !['OWNER', 'MEMBER'].includes(row.role) ||
            typeof row.workspace_id !== 'string' ||
            !row.workspace_id
          ) {
            throw new Error('Provisioned Personal membership is invalid.');
          }
          console.log('Private Personal provisioning verified.');
          NODE
