name: Cloudflare bootstrap workspace grants

on:
  workflow_dispatch:
    inputs:
      principal_id:
        description: Verified principal from /api/hosted/session (must begin cf-user:)
        required: true
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  grant:
    name: grant Personal and Indelitech access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Validate principal input
        shell: bash
        env:
          PRINCIPAL_ID: ${{ inputs.principal_id }}
        run: |
          set -euo pipefail
          [[ "$PRINCIPAL_ID" =~ ^cf-user:[A-Za-z0-9:_-]{3,120}$ ]] || {
            echo 'principal_id must be the verified cf-user:* value returned by /api/hosted/session' >&2
            exit 1
          }

      - name: Require Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN secret' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Bootstrap owner and exact workspace memberships
        shell: bash
        env:
          PRINCIPAL_ID: ${{ inputs.principal_id }}
        run: |
          set -euo pipefail
          USER_ID="legacy:$PRINCIPAL_ID"
          SQL="INSERT OR IGNORE INTO users (user_id, status, created_at, updated_at) VALUES ('$USER_ID', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP); INSERT OR IGNORE INTO user_principals (principal_id, user_id, provider, created_at) VALUES ('$PRINCIPAL_ID', '$USER_ID', 'CLOUDFLARE_ACCESS', CURRENT_TIMESTAMP); INSERT OR IGNORE INTO workspace_memberships (user_id, workspace_id, workspace_key, role) SELECT user_id, 'personal', 'personal', 'OWNER' FROM user_principals WHERE principal_id = '$PRINCIPAL_ID'; INSERT OR IGNORE INTO workspace_memberships (user_id, workspace_id, workspace_key, role) SELECT user_id, 'indelitech', 'indelitech', 'OWNER' FROM user_principals WHERE principal_id = '$PRINCIPAL_ID';"
          npx wrangler d1 execute daily-command-center-prod --remote --config wrangler.jsonc --command "$SQL"

      - name: Verify exact owner memberships
        shell: bash
        env:
          PRINCIPAL_ID: ${{ inputs.principal_id }}
        run: |
          set -euo pipefail
          SQL="SELECT m.workspace_key, m.workspace_id, m.role FROM user_principals p JOIN users u ON u.user_id = p.user_id JOIN workspace_memberships m ON m.user_id = u.user_id WHERE p.principal_id = '$PRINCIPAL_ID' AND u.status = 'ACTIVE' ORDER BY m.workspace_key;"
          npx wrangler d1 execute daily-command-center-prod --remote --config wrangler.jsonc --command "$SQL"
