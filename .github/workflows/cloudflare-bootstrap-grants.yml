name: Cloudflare bootstrap workspace grants

on:
  workflow_dispatch:
    inputs:
      principal_id:
        description: Verified principal from /api/hosted/session (must begin cf-user:)
        required: true
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  grant:
    name: grant Personal and Indelitech access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Validate principal input
        shell: bash
        env:
          PRINCIPAL_ID: ${{ inputs.principal_id }}
        run: |
          set -euo pipefail
          [[ "$PRINCIPAL_ID" =~ ^cf-user:[A-Za-z0-9:_-]{3,120}$ ]] || {
            echo 'principal_id must be the verified cf-user:* value returned by /api/hosted/session' >&2
            exit 1
          }

      - name: Require Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN secret' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Grant exact bootstrap workspaces
        shell: bash
        env:
          PRINCIPAL_ID: ${{ inputs.principal_id }}
        run: |
          set -euo pipefail
          SQL="INSERT OR IGNORE INTO principal_workspace_grants (principal_id, workspace_id) VALUES ('$PRINCIPAL_ID', 'personal'), ('$PRINCIPAL_ID', 'indelitech');"
          npx wrangler d1 execute daily-command-center-prod --remote --config wrangler.jsonc --command "$SQL"

      - name: Verify exact grants
        shell: bash
        env:
          PRINCIPAL_ID: ${{ inputs.principal_id }}
        run: |
          set -euo pipefail
          SQL="SELECT workspace_id FROM principal_workspace_grants WHERE principal_id = '$PRINCIPAL_ID' ORDER BY workspace_id;"
          npx wrangler d1 execute daily-command-center-prod --remote --config wrangler.jsonc --command "$SQL"
