name: Diagnose NextRequest origin

on:
  push:
    branches: [milestone/1e-f-hosted-ui-cutover]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Inspect NextRequest URL fields
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { NextRequest } from 'next/server';
          const request = new NextRequest('http://127.0.0.1:3000/api/brief', {
            headers: { host: '127.0.0.1:3000', origin: 'http://127.0.0.1:3000' }
          });
          console.log(JSON.stringify({
            url: request.url,
            urlOrigin: new URL(request.url).origin,
            urlHostname: new URL(request.url).hostname,
            urlPort: new URL(request.url).port,
            nextUrl: request.nextUrl.toString(),
            nextUrlOrigin: request.nextUrl.origin,
            nextUrlHostname: request.nextUrl.hostname,
            nextUrlPort: request.nextUrl.port,
            host: request.headers.get('host'),
            origin: request.headers.get('origin')
          }, null, 2));
          EOF
