name: One-shot 1G-G Control Center integration

on:
  push:
    branches:
      - milestone/1g-g-today-financial-pulse

permissions:
  contents: write

jobs:
  patch-control-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact 1G-G Today integration
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/control-center.tsx")
          text = path.read_text(encoding="utf-8")

          import_anchor = 'import { HostedIntelTodayPanel } from "@/components/hosted-intel-today";'
          import_replacement = import_anchor + '\nimport { TodayFinancialPulse } from "@/components/today-financial-pulse";'
          if text.count(import_anchor) != 1:
              raise SystemExit(f"Expected exactly one import anchor, found {text.count(import_anchor)}")
          if 'import { TodayFinancialPulse } from "@/components/today-financial-pulse";' not in text:
              text = text.replace(import_anchor, import_replacement, 1)

          jsx_anchor = '      {!personal && <HostedIntelTodayPanel onOpenIntel={() => goTo("industry")} />}\n'
          jsx_replacement = '      <TodayFinancialPulse workspaceId={workspaceId} />\n' + jsx_anchor
          if text.count(jsx_anchor) != 1:
              raise SystemExit(f"Expected exactly one Today JSX anchor, found {text.count(jsx_anchor)}")
          if '      <TodayFinancialPulse workspaceId={workspaceId} />\n' not in text:
              text = text.replace(jsx_anchor, jsx_replacement, 1)

          path.write_text(text, encoding="utf-8")
      - name: Remove one-shot workflow and commit product change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-1g-g-control-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/control-center.tsx .github/workflows/one-shot-1g-g-control-center.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "Surface Financial Pulse on hosted Today"
          git push origin HEAD:milestone/1g-g-today-financial-pulse
