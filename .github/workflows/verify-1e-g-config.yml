name: Verify 1E-G Cloudflare config

on:
  push:
    branches: [milestone/1e-g-first-cloudflare-deploy]

permissions:
  contents: read

jobs:
  verify-config:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build:vinext
      - name: Verify generated production bindings remain private
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/server/wrangler.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
          const d1 = (config.d1_databases ?? []).find((x) => x.binding === 'DB');
          const kv = (config.kv_namespaces ?? []).find((x) => x.binding === 'VINEXT_KV_CACHE');
          if (config.name !== 'daily-command-center') throw new Error(`unexpected Worker name: ${config.name}`);
          if (config.workers_dev !== false) throw new Error('workers_dev must remain disabled during bootstrap');
          if (config.preview_urls !== false) throw new Error('preview_urls must remain disabled during bootstrap');
          if (d1?.database_id !== '2f67ea9a-bf97-4008-9031-2ebfdb5a6e57') throw new Error('D1 binding missing or incorrect');
          if (kv?.id !== '1eeed318e05d45c7896f7c0dad3d8b85') throw new Error('KV binding missing or incorrect');
          if (config.vars?.TEAM_DOMAIN !== 'https://young-truth-3b40.cloudflareaccess.com') throw new Error('TEAM_DOMAIN missing or incorrect');
          if ('POLICY_AUD' in (config.vars ?? {})) throw new Error('POLICY_AUD must not be guessed before Access application creation');
          console.log('1E-G generated Cloudflare config verified.');
          EOF
