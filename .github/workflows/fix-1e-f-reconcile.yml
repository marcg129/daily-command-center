name: Fix 1E-F hosted reconciliation

on:
  push:
    branches: [milestone/1e-f-hosted-ui-cutover]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/1e-f-hosted-ui-cutover
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Guard hosted reconciliation against newer optimistic edits
        shell: python
        run: |
          from pathlib import Path
          path = Path("components/control-center.tsx")
          text = path.read_text()
          old = '''      if (runtimeMode === "hosted" && activeWorkspaceRef.current === mutationWorkspaceId) {\n        lastScheduledTasks.current = payload.tasks;\n        setTasks(payload.tasks);\n      }'''
          new = '''      if (\n        runtimeMode === "hosted" &&\n        activeWorkspaceRef.current === mutationWorkspaceId &&\n        lastScheduledTasks.current === scheduledTasks\n      ) {\n        lastScheduledTasks.current = payload.tasks;\n        setTasks(payload.tasks);\n      }'''
          if old not in text:
              raise SystemExit("expected hosted reconciliation block not found")
          path.write_text(text.replace(old, new, 1))
      - run: npm run lint
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-1e-f-reconcile.yml
          git add components/control-center.tsx
          git config user.name "Marc G"
          git config user.email "38407880+marcg129@users.noreply.github.com"
          git commit -m "fix: preserve newer hosted task edits during reconciliation"
          git push origin HEAD:milestone/1e-f-hosted-ui-cutover
