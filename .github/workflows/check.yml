name: Check

on:
  push:
    branches-ignore: [main]
  # Include closed so API-driven merges still validate the resulting main SHA,
  # even when the merge actor does not emit a separate push workflow.
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm run setup
      - run: npm run check
      - run: npm run build:mcp
      - run: npm run smoke
