name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm run setup
      - run: npm run check
      - name: Build vinext deployment artifact
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:vinext
      - name: Verify generated web Custom Domain
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
          const routes = config.routes ?? [];
          if (config.workers_dev !== true) throw new Error('Generated workers_dev must remain enabled during 1G-C rollback window');
          if (config.preview_urls !== false) throw new Error('Generated preview_urls must remain disabled');
          if (routes.length !== 1 || routes[0]?.pattern !== 'command.coreyg.dev' || routes[0]?.custom_domain !== true) throw new Error('Generated Custom Domain mismatch');
          if (config.vars?.TEAM_DOMAIN !== 'https://young-truth-3b40.cloudflareaccess.com') throw new Error('Generated TEAM_DOMAIN mismatch');
          if (config.vars?.POLICY_AUD !== '46a73a1e35edf7220a912c519941f0aa246864dc7bc9229a24997a826f8b8d3f') throw new Error('Generated POLICY_AUD mismatch');
          EOF
      - run: npm run build:mcp
      - run: npm run build:intel
      - run: npm run build:todoist
      - run: npm run smoke
