name: Generate vinext adoption patch

on:
  push:
    branches: [milestone/1e-c-vinext-adoption]

permissions:
  contents: write

env:
  VINEXT_VERSION: 1.0.0-beta.9
  OUT: .tmp/vinext-adoption

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install existing locked dependencies
        run: npm ci

      - name: Run real vinext compatibility check and initializer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          npx --yes "vinext@$VINEXT_VERSION" check 2>&1 | tee "$OUT/vinext-check.txt"
          npx --yes "vinext@$VINEXT_VERSION" init --skip-check --platform=cloudflare 2>&1 | tee "$OUT/vinext-init.txt"
          git status --short | tee "$OUT/status.txt"
          git add -N .
          git diff --binary > "$OUT/vinext-init.patch"
          cp package.json "$OUT/package.json"
          cp package-lock.json "$OUT/package-lock.json"
          for file in vite.config.* wrangler.* worker-configuration.d.ts; do
            if [ -f "$file" ]; then cp "$file" "$OUT/"; fi
          done

      - name: Validate source-controlled candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm test
          npx tsc --noEmit
          npm run build
          build_script="$(node -e 'const p=require("./package.json"); for (const n of ["build:vinext","build:cloudflare"]) if (p.scripts?.[n]) { console.log(n); process.exit(0) } process.exit(1)')"
          npm run "$build_script" 2>&1 | tee "$OUT/vinext-build.txt"
          git diff --check

      - name: Smoke-test vinext dev runtime
        shell: bash
        run: |
          set -euo pipefail
          dev_script="$(node -e 'const p=require("./package.json"); for (const n of ["dev:vinext","dev:cloudflare"]) if (p.scripts?.[n]) { console.log(n); process.exit(0) } process.exit(1)')"
          npm run "$dev_script" -- --port 4173 > "$OUT/vinext-dev.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          code=""
          for attempt in {1..60}; do
            code="$(curl --noproxy '*' --silent --show-error --output "$OUT/root.html" --write-out '%{http_code}' http://localhost:4173/ || true)"
            [ "$code" = 200 ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$OUT/vinext-dev.log" >&2
              exit 1
            fi
            sleep 1
          done
          test "${code:-}" = 200

      - name: Read-only dependency audit
        shell: bash
        run: |
          set +e
          npm audit --json > "$OUT/npm-audit.json"
          audit_exit=$?
          set -e
          node - "$OUT/npm-audit.json" "$OUT/npm-audit-summary.txt" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.error) throw new Error(report.error.summary || JSON.stringify(report.error));
          const counts = report.metadata?.vulnerabilities || {};
          fs.writeFileSync(process.argv[3], JSON.stringify(counts, null, 2) + '\n');
          const high = Number(counts.high || 0);
          const critical = Number(counts.critical || 0);
          if (high > 0 || critical > 0) process.exit(2);
          NODE
          exit "$audit_exit"

      - name: Commit validated initializer output
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/vinext-generate.yml
          git add .gitignore package.json package-lock.json vite.config.ts wrangler.jsonc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: adopt vinext alongside Next.js"
          git push origin HEAD:milestone/1e-c-vinext-adoption

      - name: Upload generated patch and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-adoption
          path: .tmp/vinext-adoption
          if-no-files-found: warn
