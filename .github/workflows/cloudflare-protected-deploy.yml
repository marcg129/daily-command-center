name: Cloudflare deploy (Access protected)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  resolve-deploy-target:
    name: resolve a validated current-main revision
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.target.outputs.deploy_sha }}
    steps:
      - name: Resolve trusted deployment target
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const { data: main } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: repository.default_branch,
            });

            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('deploy_sha', main.commit.sha);
              return;
            }

            const run = context.payload.workflow_run;
            const pullRequests = run.pull_requests ?? [];
            if (run.event !== 'pull_request' || pullRequests.length !== 1) return;

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullRequests[0].number,
            });

            if (
              pullRequest.merged_at &&
              pullRequest.base.ref === repository.default_branch &&
              pullRequest.head.sha === run.head_sha &&
              pullRequest.merge_commit_sha === main.commit.sha
            ) {
              core.setOutput('deploy_sha', main.commit.sha);
            }

  deploy:
    name: deploy Access-protected workers.dev
    needs: resolve-deploy-target
    if: needs.resolve-deploy-target.outputs.deploy_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Require Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN secret' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Verify protected production config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const raw = fs.readFileSync('wrangler.jsonc', 'utf8');
          const config = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, ''));
          const d1 = (config.d1_databases ?? []).find((x) => x.binding === 'DB');
          const kv = (config.kv_namespaces ?? []).find((x) => x.binding === 'VINEXT_KV_CACHE');
          if (config.name !== 'daily-command-center') throw new Error('Unexpected Worker name');
          if (config.workers_dev !== true) throw new Error('workers_dev must be enabled only after Access is attached');
          if (config.preview_urls !== false) throw new Error('preview_urls must remain disabled');
          if (d1?.database_id !== '2f67ea9a-bf97-4008-9031-2ebfdb5a6e57') throw new Error('Unexpected D1 database binding');
          if (kv?.id !== '1eeed318e05d45c7896f7c0dad3d8b85') throw new Error('Unexpected KV namespace binding');
          if (config.vars?.TEAM_DOMAIN !== 'https://young-truth-3b40.cloudflareaccess.com') throw new Error('Unexpected Access team domain');
          if (config.vars?.POLICY_AUD !== '46a73a1e35edf7220a912c519941f0aa246864dc7bc9229a24997a826f8b8d3f') throw new Error('Unexpected Access application audience');

          const mcpRaw = fs.readFileSync('wrangler.mcp.jsonc', 'utf8');
          const mcp = JSON.parse(mcpRaw.replace(/^\s*\/\/.*$/gm, ''));
          const mcpD1 = (mcp.d1_databases ?? []).find((x) => x.binding === 'DB');
          if (mcp.name !== 'daily-command-center-mcp') throw new Error('Unexpected MCP Worker name');
          if (mcp.main !== 'workers/task-capture-mcp.ts') throw new Error('Unexpected MCP Worker entry');
          if (mcp.workers_dev !== true) throw new Error('MCP workers_dev must be enabled for Access Managed OAuth');
          if (mcp.preview_urls !== false) throw new Error('MCP preview_urls must remain disabled');
          if (mcpD1?.database_id !== '2f67ea9a-bf97-4008-9031-2ebfdb5a6e57') throw new Error('Unexpected MCP D1 binding');
          if (mcp.vars?.TEAM_DOMAIN !== 'https://young-truth-3b40.cloudflareaccess.com') throw new Error('Unexpected MCP Access team domain');
          EOF

      - name: Confirm production migrations are current
        run: npx wrangler d1 migrations apply daily-command-center-prod --remote --config wrangler.jsonc

      - name: Build vinext production bundle
        run: npm run build:vinext

      - name: Verify generated Worker remains Access-scoped
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
          if (config.workers_dev !== true) throw new Error('Generated workers_dev must be true');
          if (config.preview_urls !== false) throw new Error('Generated preview_urls must remain false');
          if (config.vars?.TEAM_DOMAIN !== 'https://young-truth-3b40.cloudflareaccess.com') throw new Error('Generated TEAM_DOMAIN mismatch');
          if (config.vars?.POLICY_AUD !== '46a73a1e35edf7220a912c519941f0aa246864dc7bc9229a24997a826f8b8d3f') throw new Error('Generated POLICY_AUD mismatch');
          EOF

      - name: Deploy protected Worker
        run: npm run deploy:vinext

      - name: Build task-capture MCP Worker
        run: npm run build:mcp

      - name: Deploy fail-closed task-capture MCP Worker
        run: npm run deploy:mcp

      - name: Confirm deployment posture
        run: |
          echo 'workers.dev enabled with the committed Cloudflare Access audience.'
          echo 'Task-capture MCP rejects every request unless its separate Access audience secret verifies.'
          echo 'Preview URLs remain disabled.'
          echo 'Deployment targeted the current main SHA after a successful merged-PR Check rerun or an explicit manual dispatch.'
