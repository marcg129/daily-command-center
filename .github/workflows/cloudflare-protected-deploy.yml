name: Cloudflare deploy (Access protected)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: deploy Access-protected workers.dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Require Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN secret' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Verify protected production config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const raw = fs.readFileSync('wrangler.jsonc', 'utf8');
          const config = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, ''));
          const d1 = (config.d1_databases ?? []).find((x) => x.binding === 'DB');
          const kv = (config.kv_namespaces ?? []).find((x) => x.binding === 'VINEXT_KV_CACHE');
          if (config.name !== 'daily-command-center') throw new Error('Unexpected Worker name');
          if (config.workers_dev !== true) throw new Error('workers_dev must be enabled only after Access is attached');
          if (config.preview_urls !== false) throw new Error('preview_urls must remain disabled');
          if (d1?.database_id !== '2f67ea9a-bf97-4008-9031-2ebfdb5a6e57') throw new Error('Unexpected D1 database binding');
          if (kv?.id !== '1eeed318e05d45c7896f7c0dad3d8b85') throw new Error('Unexpected KV namespace binding');
          if (config.vars?.TEAM_DOMAIN !== 'https://young-truth-3b40.cloudflareaccess.com') throw new Error('Unexpected Access team domain');
          if (config.vars?.POLICY_AUD !== '46a73a1e35edf7220a912c519941f0aa246864dc7bc9229a24997a826f8b8d3f') throw new Error('Unexpected Access application audience');
          EOF

      - name: Confirm production migrations are current
        run: npx wrangler d1 migrations apply daily-command-center-prod --remote --config wrangler.jsonc

      - name: Build vinext production bundle
        run: npm run build:vinext

      - name: Verify generated Worker remains Access-scoped
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
          if (config.workers_dev !== true) throw new Error('Generated workers_dev must be true');
          if (config.preview_urls !== false) throw new Error('Generated preview_urls must remain false');
          if (config.vars?.TEAM_DOMAIN !== 'https://young-truth-3b40.cloudflareaccess.com') throw new Error('Generated TEAM_DOMAIN mismatch');
          if (config.vars?.POLICY_AUD !== '46a73a1e35edf7220a912c519941f0aa246864dc7bc9229a24997a826f8b8d3f') throw new Error('Generated POLICY_AUD mismatch');
          EOF

      - name: Deploy protected Worker
        run: npm run deploy:vinext

      - name: Confirm deployment posture
        run: |
          echo 'workers.dev enabled with the committed Cloudflare Access audience.'
          echo 'Preview URLs remain disabled.'
          echo 'Next step: verify unauthenticated interception before granting workspace access.'
