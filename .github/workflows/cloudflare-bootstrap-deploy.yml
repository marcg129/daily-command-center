name: Cloudflare bootstrap deploy (private)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  bootstrap-deploy:
    name: migrate D1 and upload inaccessible Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Require Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN secret' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Verify bootstrap config is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const raw = fs.readFileSync('wrangler.jsonc', 'utf8');
          const config = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, ''));
          const d1 = (config.d1_databases ?? []).find((x) => x.binding === 'DB');
          const kv = (config.kv_namespaces ?? []).find((x) => x.binding === 'VINEXT_KV_CACHE');
          if (config.name !== 'daily-command-center') throw new Error('Unexpected Worker name');
          if (config.workers_dev !== false) throw new Error('workers_dev must be false for bootstrap');
          if (config.preview_urls !== false) throw new Error('preview_urls must be false for bootstrap');
          if (d1?.database_id !== '2f67ea9a-bf97-4008-9031-2ebfdb5a6e57') throw new Error('Unexpected D1 database binding');
          if (kv?.id !== '1eeed318e05d45c7896f7c0dad3d8b85') throw new Error('Unexpected KV namespace binding');
          if (config.vars?.TEAM_DOMAIN !== 'https://young-truth-3b40.cloudflareaccess.com') throw new Error('Unexpected Access team domain');
          if ('POLICY_AUD' in (config.vars ?? {})) throw new Error('POLICY_AUD must not exist before Access application creation');
          EOF

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply daily-command-center-prod --remote --config wrangler.jsonc

      - name: Build vinext production bundle
        run: npm run build:vinext

      - name: Verify generated Worker remains inaccessible
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
          if (config.workers_dev !== false) throw new Error('Generated workers_dev must remain false');
          if (config.preview_urls !== false) throw new Error('Generated preview_urls must remain false');
          if ('POLICY_AUD' in (config.vars ?? {})) throw new Error('Generated POLICY_AUD must remain absent');
          EOF

      - name: Upload private bootstrap Worker
        run: npm run deploy:vinext

      - name: Confirm bootstrap safety posture
        run: |
          echo 'Worker uploaded with workers.dev disabled, preview URLs disabled, and no Access audience configured.'
          echo 'Do not enable a public route until Cloudflare Access is attached and POLICY_AUD is committed.'
