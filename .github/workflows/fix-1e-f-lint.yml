name: Fix 1E-F React ref lint

on:
  push:
    branches: [milestone/1e-f-hosted-ui-cutover]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/1e-f-hosted-ui-cutover
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Apply narrow lint correction
        shell: python
        run: |
          from pathlib import Path

          component = Path("components/control-center.tsx")
          text = component.read_text()
          old = '''  const activeWorkspaceRef = useRef(activeWorkspaceId);\n  activeWorkspaceRef.current = activeWorkspaceId;\n  const workspaceRequestId = runtimeMode === "hosted" ? activeWorkspaceId : DEFAULT_WORKSPACE_ID;\n\n  useEffect(() => {'''
          new = '''  const activeWorkspaceRef = useRef(activeWorkspaceId);\n  const workspaceRequestId = runtimeMode === "hosted" ? activeWorkspaceId : DEFAULT_WORKSPACE_ID;\n\n  useEffect(() => {\n    activeWorkspaceRef.current = activeWorkspaceId;\n  }, [activeWorkspaceId]);\n\n  useEffect(() => {'''
          if old not in text:
              raise SystemExit("expected control-center ref pattern not found")
          component.write_text(text.replace(old, new, 1))

          test_file = Path("tests/hosted-task-routes.test.ts")
          test_text = test_file.read_text()
          test_file.write_text(test_text.replace("  type SessionProvider,\n", "", 1))
      - run: npm run lint
      - name: Commit correction and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-1e-f-lint.yml
          git add components/control-center.tsx tests/hosted-task-routes.test.ts
          git config user.name "Marc G"
          git config user.email "38407880+marcg129@users.noreply.github.com"
          git commit -m "fix: sync hosted workspace ref after render"
          git push origin HEAD:milestone/1e-f-hosted-ui-cutover
