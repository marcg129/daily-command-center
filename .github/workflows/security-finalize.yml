name: Security finalization

on:
  push:
    branches: [finalize/1b-d-security]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Regenerate lockfile from controlled pins
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Verify patched dependency versions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const checks = {
            next: ['node_modules/next', '16.3.3'],
            'js-yaml': ['node_modules/js-yaml', '4.3.2'],
            sharp: ['node_modules/sharp', '0.35.4'],
          };
          for (const [name, [key, expected]] of Object.entries(checks)) {
            const actual = lock.packages?.[key]?.version;
            if (actual !== expected) throw new Error(`${name}: expected ${expected}, got ${actual}`);
            console.log(`${name}=${actual}`);
          }
          NODE

      - name: Require no high or critical npm audit findings
        shell: bash
        run: |
          set +e
          npm audit --json > security-audit.json
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('security-audit.json', 'utf8'));
          if (report.error) throw new Error(report.error.summary || JSON.stringify(report.error));
          const severe = Object.entries(report.vulnerabilities || {})
            .filter(([, item]) => item.severity === 'high' || item.severity === 'critical');
          console.log(`audit vulnerabilities=${Object.keys(report.vulnerabilities || {}).length}`);
          if (severe.length) {
            throw new Error(`remaining high/critical vulnerabilities: ${severe.map(([n, v]) => `${n}:${v.severity}`).join(', ')}`);
          }
          NODE

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Recheck vinext compatibility
        run: npx --yes vinext@1.0.0-beta.9 check

      - name: Commit validated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches controlled pins"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for security patches"
          git push origin HEAD:finalize/1b-d-security
