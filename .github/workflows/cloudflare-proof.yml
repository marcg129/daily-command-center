name: Cloudflare toolchain proof (non-production)

on:
  push:
    branches: [milestone/1e-c-vinext-adoption]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROOF_DIR: .tmp/cloudflare-proof

jobs:
  cloudflare-proof:
    name: committed vinext and genuine local D1 proof
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Initialize proof report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          printf '%s\n' \
            "Node version=$(node --version)" \
            "ordinary Next build=NOT_RUN" \
            "vinext compatibility=NOT_RUN" \
            "vinext build=NOT_RUN" \
            "vinext dev smoke=NOT_RUN" \
            "local D1 migrations=NOT_RUN" \
            "D1 semantic proof=NOT_RUN" \
            "repository binding proof=NOT_RUN" \
            "dependency audit=NOT_RUN" > "$PROOF_DIR/result.txt"

      - name: Install committed locked dependencies
        run: npm ci

      - name: Record committed Cloudflare tool versions
        shell: bash
        run: |
          set -euo pipefail
          npm ls vinext vite wrangler @cloudflare/vite-plugin @vinext/cloudflare --depth=0 --json > "$PROOF_DIR/tool-versions.json"
          cat "$PROOF_DIR/tool-versions.json" | tee -a "$PROOF_DIR/result.txt"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Ordinary Next.js production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          sed -i 's/ordinary Next build=NOT_RUN/ordinary Next build=PASS/' "$PROOF_DIR/result.txt"

      - name: Validate committed vinext compatibility
        shell: bash
        run: |
          set -euo pipefail
          npx vinext check 2>&1 | tee "$PROOF_DIR/vinext-check.txt"
          sed -i 's/vinext compatibility=NOT_RUN/vinext compatibility=PASS/' "$PROOF_DIR/result.txt"

      - name: Build committed vinext production path
        shell: bash
        run: |
          set -euo pipefail
          npm run build:vinext 2>&1 | tee "$PROOF_DIR/vinext-build.txt"
          test -d dist
          sed -i 's/vinext build=NOT_RUN/vinext build=PASS/' "$PROOF_DIR/result.txt"

      - name: Smoke-test committed vinext development runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:vinext -- --port 4173 > "$PROOF_DIR/vinext-dev.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          code=""
          for attempt in {1..60}; do
            code="$(curl --noproxy '*' --silent --show-error \
              --output "$PROOF_DIR/vinext-root.html" \
              --write-out '%{http_code}' \
              http://localhost:4173/ || true)"
            [ "$code" = 200 ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$PROOF_DIR/vinext-dev.log" >&2
              exit 1
            fi
            sleep 1
          done
          test "${code:-}" = 200
          sed -i 's/vinext dev smoke=NOT_RUN/vinext dev smoke=PASS/' "$PROOF_DIR/result.txt"

      - name: Prepare disposable local D1 Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR/migrations" "$PROOF_DIR/state"
          cp migrations/000{1,2,3,4,5,6}_*.sql "$PROOF_DIR/migrations/"
          cat > "$PROOF_DIR/wrangler.toml" <<'EOF'
          name = "daily-command-center-ci-proof"
          main = "../../scripts/cloudflare-proof-worker.ts"
          compatibility_date = "2026-09-11"
          compatibility_flags = ["nodejs_compat"]

          [[d1_databases]]
          binding = "DB"
          database_name = "daily-command-center-ci"
          database_id = "00000000-0000-0000-0000-000000000000"
          migrations_dir = "./migrations"
          EOF
          npx wrangler --version | tee -a "$PROOF_DIR/result.txt"

      - name: Apply migrations 0001 through 0006 to genuine local D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --local \
            --persist-to "$PROOF_DIR/state" --config "$PROOF_DIR/wrangler.toml"
          sed -i 's/local D1 migrations=NOT_RUN/local D1 migrations=PASS/' "$PROOF_DIR/result.txt"

      - name: Exercise actual env.DB binding, rollback, constraints, and repositories
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8789 \
            --persist-to "$PROOF_DIR/state" --config "$PROOF_DIR/wrangler.toml" > "$PROOF_DIR/d1-worker.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            code="$(curl --silent --output "$PROOF_DIR/d1-proof.json" --write-out '%{http_code}' http://127.0.0.1:8789/proof || true)"
            [ "$code" = 200 ] && break
            sleep 1
          done
          test "${code:-}" = 200
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1])); if (!p.ok || !p.results.every(x=>x.endsWith("=PASS"))) throw Error(JSON.stringify(p)); console.log(p.results.join("\n"))' \
            "$PROOF_DIR/d1-proof.json" | tee "$PROOF_DIR/d1-semantic-proof.txt"
          sed -i 's/D1 semantic proof=NOT_RUN/D1 semantic proof=PASS/; s/repository binding proof=NOT_RUN/repository binding proof=PASS/' "$PROOF_DIR/result.txt"

      - name: Read-only dependency audit
        shell: bash
        run: |
          set +e
          npm audit --json > "$PROOF_DIR/npm-audit.json"
          audit_exit=$?
          set -e
          node - "$PROOF_DIR/npm-audit.json" "$PROOF_DIR/npm-audit-summary.txt" <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (report.error) throw new Error(report.error.summary || JSON.stringify(report.error));
          const counts = report.metadata?.vulnerabilities || {};
          fs.writeFileSync(process.argv[3], JSON.stringify(counts, null, 2) + "\n");
          if (Number(counts.high || 0) > 0 || Number(counts.critical || 0) > 0) process.exit(2);
          NODE
          test "$audit_exit" -eq 0
          sed -i 's/dependency audit=NOT_RUN/dependency audit=PASS/' "$PROOF_DIR/result.txt"

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-proof
          path: |
            .tmp/cloudflare-proof/result.txt
            .tmp/cloudflare-proof/tool-versions.json
            .tmp/cloudflare-proof/vinext-check.txt
            .tmp/cloudflare-proof/vinext-build.txt
            .tmp/cloudflare-proof/vinext-dev.log
            .tmp/cloudflare-proof/vinext-root.html
            .tmp/cloudflare-proof/d1-semantic-proof.txt
            .tmp/cloudflare-proof/d1-proof.json
            .tmp/cloudflare-proof/d1-worker.log
            .tmp/cloudflare-proof/npm-audit.json
            .tmp/cloudflare-proof/npm-audit-summary.txt
          if-no-files-found: warn

      - name: Print final proof result
        if: always()
        run: cat "$PROOF_DIR/result.txt"
