name: Remove PR68 recovery workflows

on:
  push:
    branches:
      - milestone/1g-f3-cashflow-ui

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/1g-f3-cashflow-ui
          fetch-depth: 0
      - name: Remove temporary recovery workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr68-apply-review-fix.yml .github/workflows/pr68-diagnose-review-fix.yml
          git commit -m "Remove temporary PR68 recovery workflows"
          git push origin HEAD:milestone/1g-f3-cashflow-ui
