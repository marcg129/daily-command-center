name: Diagnose corrected PR68 recovery patch

on:
  push:
    branches:
      - milestone/1g-f3-cashflow-ui

permissions:
  contents: read

jobs:
  diagnose-corrected-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/1g-f3-cashflow-ui
          fetch-depth: 0
      - name: Extract, correct, and inspect patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /cat > \/tmp\/pr68-review-fix\.patch/ { capture=1; next }
            capture && /^[[:space:]]*PATCH[[:space:]]*$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/pr68-apply-review-fix.yml > /tmp/pr68-review-fix.patch
          python - <<'PY' > /tmp/replacement.log 2>&1
          from pathlib import Path
          path = Path('/tmp/pr68-review-fix.patch')
          text = path.read_text()
          old = '         setBaselineError("");\n+        setLoadedWorkspaceId(workspaceId);\n       }\n'
          new = '           setBaselineError("");\n+          setLoadedWorkspaceId(workspaceId);\n         }\n'
          count = text.count(old)
          print(f'malformed hunk matches: {count}')
          if count != 1:
              raise SystemExit(f'expected exactly one malformed hunk context, found {count}')
          path.write_text(text.replace(old, new, 1))
          print('replacement completed')
          PY
          replacement_status=$?
          set +e
          git apply --check --verbose /tmp/pr68-review-fix.patch > /tmp/apply-check.log 2>&1
          apply_status=$?
          set -e
          {
            echo "replacement exit status: ${replacement_status}"
            cat /tmp/replacement.log
            echo "git apply --check exit status: ${apply_status}"
            echo "head: $(git rev-parse HEAD)"
            echo "cash-flow-view blob: $(git hash-object components/cash-flow-view.tsx)"
            echo "cash-flow contract blob: $(git hash-object tests/cash-flow-ui-contract.test.ts)"
            echo
            cat /tmp/apply-check.log
          } | tee /tmp/pr68-corrected-patch-diagnostic.txt
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr68-corrected-patch-diagnostic
          path: |
            /tmp/pr68-corrected-patch-diagnostic.txt
            /tmp/pr68-review-fix.patch
          if-no-files-found: error
