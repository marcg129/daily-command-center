name: Apply validated PR68 recovery patch

on:
  push:
    branches:
      - milestone/1g-f3-cashflow-ui

permissions:
  contents: write

jobs:
  apply-validated-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/1g-f3-cashflow-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Extract and validate reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /cat > \/tmp\/pr68-review-fix\.patch/ { capture=1; next }
            capture && /^[[:space:]]*PATCH[[:space:]]*$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/pr68-apply-review-fix.yml > /tmp/pr68-review-fix.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/pr68-review-fix.patch')
          text = path.read_text()
          replacements = [
              (
                  '         setBaselineError("");\n+        setLoadedWorkspaceId(workspaceId);\n       }\n',
                  '           setBaselineError("");\n+          setLoadedWorkspaceId(workspaceId);\n         }\n',
                  'load-completion hunk',
              ),
              (
                  '           {!next ? <section',
                  '             {!next ? <section',
                  'overdue-income hunk',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one malformed {label} context, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          test "$(git hash-object components/cash-flow-view.tsx)" = "60a7d02e19a8640f53499b4ee13a54958e0975c1"
          test "$(git hash-object tests/cash-flow-ui-contract.test.ts)" = "587f2acada9211d11f6c2f79554a3b535319ce79"
          git apply --check --verbose /tmp/pr68-review-fix.patch
          git apply /tmp/pr68-review-fix.patch
          git diff --check -- components/cash-flow-view.tsx tests/cash-flow-ui-contract.test.ts
      - run: npm run setup
      - run: npm run check
      - name: Commit reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/cash-flow-view.tsx tests/cash-flow-ui-contract.test.ts
          git diff --cached --check
          git commit -m "Fix Cash Flow financial integrity review findings"
          git push origin HEAD:milestone/1g-f3-cashflow-ui
